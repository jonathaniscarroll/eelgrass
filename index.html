<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Eelgrass AR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background: #000;
    }
    
    #ar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    
    #debug {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      z-index: 100;
      max-width: 300px;
      max-height: 200px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="status">Loading AR...</div>
  <div id="debug"></div>
  
  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    // Debug logging
    const debugEl = document.getElementById('debug');
    const statusEl = document.getElementById('status');
    
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      debugEl.innerHTML += `[${time}] ${msg}<br>`;
      debugEl.scrollTop = debugEl.scrollHeight;
      console.log(`[AR] ${msg}`);
    }
    
    // ============================================
    // CUSTOM TRIGGER FUNCTIONS - EDIT THESE
    // ============================================
    
    function onTargetFound(targetIndex) {
      log(`✓ Target ${targetIndex} FOUND`);
      statusEl.textContent = `Target ${targetIndex} detected!`;
      statusEl.style.background = 'rgba(0, 128, 0, 0.8)';
      
      // YOUR CUSTOM LOGIC HERE
      // Examples:
      // - Play audio: new Audio('sound.mp3').play();
      // - Show/hide DOM elements
      // - Load video content
      // - Trigger animations
      // - Send analytics
      // - Navigate to another page
    }
    
    function onTargetLost(targetIndex) {
      log(`✗ Target ${targetIndex} LOST`);
      statusEl.textContent = 'Scanning...';
      statusEl.style.background = 'rgba(0, 0, 0, 0.7)';
      
      // YOUR CLEANUP LOGIC HERE
    }
    
    function onTargetUpdate(targetIndex, anchor) {
      // Called every frame while target is tracked
      // Use anchor.group.position, anchor.group.rotation, etc.
    }
    
    // ============================================
    // AR INITIALIZATION
    // ============================================
    
    const start = async () => {
      log('Initializing MindAR...');
      
      // Check if targets.mind exists
      try {
        const response = await fetch('targets.mind');
        if (!response.ok) throw new Error('targets.mind not found');
        log('✓ targets.mind loaded');
      } catch (e) {
        log('ERROR: ' + e.message);
        statusEl.textContent = 'Error: Add targets.mind file';
        statusEl.style.background = 'rgba(128, 0, 0, 0.8)';
        return;
      }
      
      // Initialize MindAR with Three.js
      const mindarThree = new MINDAR.IMAGE.MindARThree({
        container: document.getElementById('ar-container'),
        imageTargetSrc: 'targets.mind',
        maxTrack: 2, // track multiple targets simultaneously
      });
      
      const { renderer, scene, camera } = mindarThree;
      
      // Optional: Add 3D content to anchors
      // Anchor 0 (first target)
      const anchor0 = mindarThree.addAnchor(0);
      
      // Example 3D object - replace with your content
      const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
      const material = new THREE.MeshBasicMaterial({ 
        color: 0x00ff88,
        transparent: true,
        opacity: 0.8
      });
      const cube = new THREE.Mesh(geometry, material);
      cube.position.y = 0.25; // sit on top of target
      anchor0.group.add(cube);
      
      // Wire up trigger callbacks
      anchor0.onTargetFound = () => onTargetFound(0);
      anchor0.onTargetLost = () => onTargetLost(0);
      anchor0.onTargetUpdate = () => onTargetUpdate(0, anchor0);
      
      // Anchor 1 (second target) - if you have multiple
      const anchor1 = mindarThree.addAnchor(1);
      const sphereGeo = new THREE.SphereGeometry(0.3, 32, 32);
      const sphereMat = new THREE.MeshBasicMaterial({ color: 0xff0088 });
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      anchor1.group.add(sphere);
      
      anchor1.onTargetFound = () => onTargetFound(1);
      anchor1.onTargetLost = () => onTargetLost(1);
      anchor1.onTargetUpdate = () => onTargetUpdate(1, anchor1);
      
      // Start AR
      await mindarThree.start();
      log('AR started');
      statusEl.textContent = 'Scanning...';
      
      // Render loop
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    };
    
    // Handle page load
    window.addEventListener('load', () => {
      log('Page loaded');
      start();
    });
    
    // Handle visibility changes (pause/resume camera)
    document.addEventListener('visibilitychange', () => {
      log('Visibility: ' + document.visibilityState);
    });
  </script>
</body>
</html>
