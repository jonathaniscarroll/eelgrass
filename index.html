<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Eelgrass AR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background: #000;
    }
    
    #ar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
      backdrop-filter: blur(4px);
      min-width: 200px;
      text-align: center;
    }
    
    #status.playing {
      background: rgba(0, 128, 0, 0.8);
    }
    
    #status.queued {
      background: rgba(255, 165, 0, 0.8);
    }
    
    #status.scanning {
      background: rgba(0, 0, 0, 0.7);
    }
    
    #queue-display {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 100;
      min-width: 150px;
    }
    
    #queue-display h3 {
      margin: 0 0 8px 0;
      font-size: 11px;
      text-transform: uppercase;
      color: #aaa;
      letter-spacing: 0.5px;
    }
    
    #queue-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    
    #queue-list li {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    #queue-list li:last-child {
      border-bottom: none;
    }
    
    #debug {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      z-index: 100;
      max-width: 300px;
      max-height: 200px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="status" class="scanning">Loading...</div>
  <div id="queue-display">
    <h3>Queue</h3>
    <ul id="queue-list">
      <li>Empty</li>
    </ul>
  </div>
  <div id="debug"></div>
  
  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    // ============================================
    // AUDIO CONFIGURATION
    // ============================================
    
    // Map target indices to audio file paths
    const AUDIO_CONFIG = {
      0: 'audio/Derrick Dalhousie University.wav',  // First target image
      1: 'audio/Derrick Dalhousie University2.wav',  // Second target image
      2: 'audio/Derrick Dalhousie University3.wav',  // Third target image (if you have one)
      3: 'audio/Lauren Dalhousie University 1.wav',
      4: 'audio/Lauren Dalhousie University 2.wav',
    };
    
    // ============================================
    // AUDIO QUEUE SYSTEM
    // ============================================
    
    let audioPlayer = null;
    let isPlaying = false;
    let audioQueue = [];
    let currentTrackName = '';
    
    const statusEl = document.getElementById('status');
    const queueListEl = document.getElementById('queue-list');
    const debugEl = document.getElementById('debug');
    
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      debugEl.innerHTML += `[${time}] ${msg}<br>`;
      debugEl.scrollTop = debugEl.scrollHeight;
      console.log(`[AR] ${msg}`);
    }
    
    function updateQueueDisplay() {
      if (audioQueue.length === 0) {
        queueListEl.innerHTML = '<li>Empty</li>';
      } else {
        queueListEl.innerHTML = audioQueue.map((track, i) => 
          `<li>${i === 0 ? '▶ ' : ''}${track.name}</li>`
        ).join('');
      }
    }
    
    function playAudio(trackPath, trackName) {
      if (isPlaying) {
        log(`Queueing: ${trackName}`);
        audioQueue.push({ path: trackPath, name: trackName });
        updateQueueDisplay();
        statusEl.textContent = `Queued: ${trackName}`;
        statusEl.className = 'queued';
        return;
      }
      
      log(`Playing: ${trackName}`);
      currentTrackName = trackName;
      isPlaying = true;
      statusEl.textContent = `Playing: ${trackName}`;
      statusEl.className = 'playing';
      
      audioPlayer = new Audio(trackPath);
      
      audioPlayer.onended = () => {
        log(`Finished: ${trackName}`);
        isPlaying = false;
        currentTrackName = '';
        
        // Play next in queue
        if (audioQueue.length > 0) {
          const next = audioQueue.shift();
          updateQueueDisplay();
          playAudio(next.path, next.name);
        } else {
          statusEl.textContent = 'Scanning...';
          statusEl.className = 'scanning';
          updateQueueDisplay();
        }
      };
      
      audioPlayer.onerror = (e) => {
        log(`Audio error: ${trackPath}`);
        isPlaying = false;
        statusEl.textContent = 'Error loading audio';
        statusEl.className = 'scanning';
        
        // Try next in queue
        if (audioQueue.length > 0) {
          const next = audioQueue.shift();
          updateQueueDisplay();
          playAudio(next.path, next.name);
        }
      };
      
      audioPlayer.play().catch(e => {
        log(`Playback failed: ${e.message}`);
        isPlaying = false;
        statusEl.textContent = 'Playback blocked';
        statusEl.className = 'scanning';
      });
    }
    
    // ============================================
    // AR TRIGGER FUNCTIONS
    // ============================================
    
    function onTargetFound(targetIndex) {
      const audioPath = AUDIO_CONFIG[targetIndex];
      
      if (!audioPath) {
        log(`No audio configured for target ${targetIndex}`);
        return;
      }
      
      const trackName = audioPath.split('/').pop();
      playAudio(audioPath, trackName);
    }
    
    function onTargetLost(targetIndex) {
      // Don't stop audio when target is lost - let it finish
      log(`Target ${targetIndex} lost (audio continues)`);
    }
    
    function onTargetUpdate(targetIndex, anchor) {
      // Called every frame while target is tracked
    }
    
    // ============================================
    // AR INITIALIZATION
    // ============================================
    
    const start = async () => {
      log('Initializing MindAR...');
      
      // Check if targets.mind exists
      try {
        const response = await fetch('targets.mind');
        if (!response.ok) throw new Error('targets.mind not found');
        log('✓ targets.mind loaded');
      } catch (e) {
        log('ERROR: ' + e.message);
        statusEl.textContent = 'Error: targets.mind missing';
        statusEl.className = 'scanning';
        return;
      }
      
      // Initialize MindAR with Three.js
      const mindarThree = new MINDAR.IMAGE.MindARThree({
        container: document.getElementById('ar-container'),
        imageTargetSrc: 'targets.mind',
        maxTrack: 2,
      });
      
      const { renderer, scene, camera } = mindarThree;
      
      // Add anchors for each target
      const anchor0 = mindarThree.addAnchor(0);
      anchor0.onTargetFound = () => onTargetFound(0);
      anchor0.onTargetLost = () => onTargetLost(0);
      anchor0.onTargetUpdate = () => onTargetUpdate(0, anchor0);
      
      const anchor1 = mindarThree.addAnchor(1);
      anchor1.onTargetFound = () => onTargetFound(1);
      anchor1.onTargetLost = () => onTargetLost(1);
      anchor1.onTargetUpdate = () => onTargetUpdate(1, anchor1);
      
      const anchor2 = mindarThree.addAnchor(2);
      anchor2.onTargetFound = () => onTargetFound(2);
      anchor2.onTargetLost = () => onTargetLost(2);
      anchor2.onTargetUpdate = () => onTargetUpdate(2, anchor2);
      
      // Start AR
      await mindarThree.start();
      log('AR started');
      statusEl.textContent = 'Scanning...';
      statusEl.className = 'scanning';
      
      // Render loop
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    };
    
    window.addEventListener('load', () => {
      log('Page loaded');
      start();
    });
    
    document.addEventListener('visibilitychange', () => {
      log('Visibility: ' + document.visibilityState);
    });
  </script>
</body>
</html>
